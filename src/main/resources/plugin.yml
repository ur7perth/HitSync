name: NerithMcHitSync
version: '${project.version}'
main: com.nerith.hitsync.NerithMcHitSync
api-version: '1.21'
author: Nerith
description: Ghost hit detector with automatic hit sync.

commands:
  hitsync:
    description: NerithMcHitSync main command
    usage: /<command> [status|toggle|alerts|stats|debug|reload]
    aliases: [hs]

permissions:
  nerithmchitsync.admin:
    description: Use toggle, stats, debug, reload and status
    default: op
  nerithmchitsync.alerts:
    description: Receive ghost hit alerts
    default: op
  nerithmchitsync.autofix:
    description: Allow auto hit sync for this player
    default: true

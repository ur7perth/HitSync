name: NerithMcHitSync
version: '${project.version}'
main: com.nerith.hitsync.NerithMcHitSync
api-version: '1.21'
author: Nerith
description: Ghost hit detector with automatic hit sync and wall combo protection.

commands:
  hitsync:
    description: NerithMcHitSync main command
    usage: /<command> [status|toggle <feature>|alerts|reload]
    aliases: [hs]

permissions:
  nerithmchitsync.admin:
    description: Use /hitsync toggle, reload and status
    default: op
  nerithmchitsync.alerts:
    description: Receive ghost hit alerts (ops always receive them)
    default: op
  nerithmchitsync.autofix:
    description: Allow auto hit sync for this player
    default: true

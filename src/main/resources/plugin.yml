
name: HitSync
version: 1.0.0
main: me.hitsync.HitSync
api-version: '1.20'
depend:
  - ProtocolLib

commands:
  GhostHit:
    description: Enable or disable HitSync
    usage: /GhostHit <On|Off>
    permission: hitsync.admin

permissions:
  hitsync.admin:
    description: Allows managing HitSync
    default: op

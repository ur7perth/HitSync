name: NerithMcHitSync
version: '2.0.0'
main: com.nerith.hitsync.NerithMcHitSync
api-version: '1.21'
author: Nerith
description: Exact-target hit tracking and airborne combat diagnostics.

commands:
  hitsync:
    description: NerithMcHitSync main command
    usage: /<command> [status|alerts|stats|debug|reload]
    aliases: [hs]

permissions:
  nerithmchitsync.admin:
    description: Use administrative HitSync commands
    default: op

  nerithmchitsync.alerts:
    description: Receive hit diagnostics
    default: op

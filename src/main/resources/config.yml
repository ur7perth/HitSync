prefix: "&eHitSync"

alert-format: "{prefix} &7» &c{attacker} &7ghost hit &f{target} &8[{status}&8] &7ping &f{ping}ms &7reach &f{reach}"

# Every feature can be switched on/off with /hitsync toggle <feature>
features:
  detector: true
  alerts: true
  auto-fix: true
  wall-protection: true

detector:
  # max distance (blocks) of the aim ray used to detect an attempted hit
  reach: 3.6
  aim-leniency: 0.15
  combo-leniency-bonus: 0.15
  check-delay-ticks: 1
  treat-invulnerability-as-ghost: false
  # 0 = show every alert
  alert-cooldown-ms: 0

auto-fix:
  # hits farther than this are never fixed (protects against reach hacks)
  max-reach: 4.0
  max-fixes-per-second: 20
combo:
  window-ticks: 30

wall-protection:
  inside-blocks: true
  pinned-against-wall: true
  # false = protects every hit, true = only protects follow-up combo hits
  require-combo: false
  # how close to a wall counts as "pinned"
  pin-distance: 0.5

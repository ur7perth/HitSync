enabled: true

# Max hit distance used to verify a hit (vanilla survival reach is 3.0)
reach: 3.0

# Extra distance allowed for fast moving targets (elytra, knockback)
reach-slack: 0.8

# Hitbox tolerance used when verifying that a player is under the crosshair
ray-tolerance: 0.05

# Use the attacker's ping to check where the target was when the hit was sent
ping-compensation: true

# Ticks to wait before deciding that the server did not register a hit
check-delay-ticks: 2

crit-sync:
  java: true
  bedrock: true

bedrock:
  name-prefix: "."

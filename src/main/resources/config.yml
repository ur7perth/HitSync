prefix: "&eNerithHitSync"

# This plugin diagnoses missing server-side damage processing.
# It does NOT generate a second/synthetic hit.
debug: false

features:
  detector: true
  alerts: true

detector:
  # Ping rewind is capped to avoid excessive historical compensation.
  max-rewind-ms: 300

  reach: 3.6

  aim-leniency: 0.10

  # 0 = every alert; 1500 = one alert per attacker every 1.5 seconds.
  alert-cooldown-ms: 1500

alert-format: "{prefix} &7- &c{attacker} &7unregistered hit on &f{target} &8[ping {ping}ms, {movement}]"

prefix: "&6NerithHitSync"

debug: false

features:
  detector: true
  alerts: true
  auto-fix: false

alert-format: "{prefix} &8| &c{attacker} &7-> &f{target} &8| {status} &8| &7Ping: &f{ping}ms &8| &7Movement: &e{movement} &8| &7Distance: &f{reach}"

detector:
  check-delay-ticks: 2
  max-pending-attempts: 20
  iframe-tolerance-ticks: 2
  treat-invulnerability-as-ghost: false
  alert-cooldown-ms: 500
  processed-window-ticks: 2

  min-attack-strength: 0.0
  reach: 3.6
  aim-leniency: 0.12
  combo-leniency-bonus: 0.08

  max-rewind-ms: 350
  client-interp-ticks: 1.0
  rewind-jitter-ticks: 1.5
  block-check: true

combo:
  window-ticks: 30

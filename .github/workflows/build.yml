
name: Build HitSync

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build HitSync
        run: mvn --batch-mode clean package

      - name: Upload HitSync JAR
        uses: actions/upload-artifact@v4
        with:
          name: HitSync-3.0.0
          path: target/HitSync.jar
